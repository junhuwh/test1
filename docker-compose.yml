services:
  postgres:
    image: postgres:17-alpine
    container_name: bookworm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookworm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookworm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bookworm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookworm-backend:1.0.0
    container_name: bookworm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookworm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  postgres_data:
